<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Registro de productos</title>
	<link rel="stylesheet" href="index.css">
</head>
<body>
	<main class="contenedor">
		<h1>Registro de productos</h1>
		<form action="#" method="post">
			<div class="campo">
				<label for="nombre">Nombre del producto</label>
				<input type="text" id="nombre" name="nombre" placeholder="Ej. Teclado inalámbrico" required>
			</div>

			<div class="campo">
				<label for="precio">Precio</label>
				<input type="number" id="precio" name="precio" min="0" step="0.01" placeholder="0.00" required>
			</div>

			<div class="campo">
				<label for="stock">Stock disponible</label>
				<input type="number" id="stock" name="stock" min="0" step="1" placeholder="0" required>
			</div>

			<button type="submit">Guardar producto</button>
		</form>
	</main>
</body>
</html>
