<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error 404</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
    }
    .error-card {
      max-width: 560px;
      border: none;
      border-radius: 1rem;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
    }
    .error-code {
      font-size: 6rem;
      font-weight: 700;
      color: #dc3545;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card error-card p-4 p-md-5 text-center">
      <div class="error-code">404</div>
      <h1 class="display-5 fw-bold mt-3">Oops! Página no encontrada</h1>
      <p class="text-secondary mt-3 mb-4">
        La página que estás buscando no existe o fue movida.
        Puedes volver al inicio o contactar con soporte.
      </p>
      <div class="d-flex justify-content-center gap-3 flex-wrap">
        <a href="index.html" class="btn btn-primary btn-lg">Volver al inicio</a>
        <a href="mailto:soporte@empresa.com" class="btn btn-outline-danger btn-lg">Contactar soporte</a>
      </div>
    </div>
  </div>
</body>
</html>
