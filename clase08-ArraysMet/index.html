<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Css de Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <title>Métodos de Arrays - Clase 08</title>
</head>
<body class="container">

  <h1 id="titulo" class="text-center mt-5 mb-5 bg-primary text-white p-3">
    Métodos de Arrays
  </h1>

  <!-- Formulario para ingresar datos en el Array -->
  <div class="row justify-content-center">
    <div class="col-md-9">
      <form id="formIngresar" class="bg-white p-4 rounded shadow">
        <h2 class="text-center mb-4">Ingresar Datos</h2>
        <div class="form-group mb-3">
          <label for="nombre" class="form-label">Nombre:</label>
          <input type="text" id="nombre" class="form-control" required>
        </div>
        <div class="form-group mb-3">
          <label for="edad" class="form-label">Edad:</label>
          <input type="number" id="edad" class="form-control">
        </div>
        <div class="form-group mb-3">
          <label for="email" class="form-label">Email:</label>
          <input type="email" id="email" class="form-control">
        </div>
        <button type="button" id="btnPrueba" class="btn btn-primary btn-block">Prueba de Event</button>
        <button type="reset" class="btn btn-secondary btn-block">Limpiar</button>
        <button type="button" id="btnIngresarNombre" class="btn btn-success btn-block">Ingresar (push)</button>
        <button type="button" id="btnIngresarUsuario" class="btn btn-danger btn-block">Ingresar (unshift)</button>
        <button type="button" onclick="eliminarUltimoUsuario()" id="btnEliminarUser" class="btn btn-warning btn-block">Eliminar (pop)</button>
        <button type="button" onclick="eliminarPrimeroUsuario()" id="btnEliminarUser" class="btn btn-secondary btn-block">Eliminar (shift)</button>

      </form>

      <h2 class="text-center mb-4">
        <!-- Mostramos la lista de usuarios -->
        Lista de Usuarios:
      </h2>

      <button type="button" id="btnImprimirParrafo" class="btn btn-info btn-block">Imprimir Parrafo</button>

      <p id="listaUsuariosText">

      </p>

      <ol id="listaUsuarios" class="list-group">

        <li>Pepe Perez</li>

      </ol>
    </div>
  </div>

</body>
</html>
